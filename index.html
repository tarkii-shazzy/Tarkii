<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Puchhuu ❤️ Shazzy</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
  text-align: center;
}

/* full screen section */
.section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  opacity: 0;
  transform: translateY(40px);
  transition: all 1s ease;
}

/* visible animation */
.section.show {
  opacity: 1;
  transform: translateY(0);
}

/* image */
.story-img {
  width: 90%;
  max-width: 1000px;
  border-radius: 20px;
  box-shadow: 0 0 30px rgba(255,255,255,0.2);
}

/* final text */
.final {
  font-size: 2em;
  padding: 20px;
}
</style>

</head>

<body>

<!-- SECTION 1 -->

<div class="section">
  <h1>Puchhuu ❤️ Shazzy</h1>
  <p>A little story about how everything changed...</p>
</div>

<!-- SECTION 2 (YOUR IMAGE) -->

<div class="section">
  <img src="story.png" class="story-img">
</div>

<!-- SECTION 3 -->

<div class="section">
  <div class="final">
    Thank you for making Puchhuu the happiest ❤️ <br><br>
    I love you, Shazzy.
  </div>
</div>

<script>
const sections = document.querySelectorAll(".section");

window.addEventListener("scroll", () => {
  sections.forEach(sec => {
    const top = sec.getBoundingClientRect().top;
    if (top < window.innerHeight - 100) {
      sec.classList.add("show");
    }
  });
});
</script>

</body>
</html>
